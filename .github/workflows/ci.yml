name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push that supersedes another on the same ref makes the earlier run's result
# irrelevant, and this workflow is nine jobs wide. main is excluded: its runs are
# what the badge and the release history refer to, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} / ${{ matrix.psr18 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['prefer-lowest', 'prefer-stable']
        psr18: ['guzzle', 'symfony']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, bcmath
          coverage: none

      - name: Select PSR-18 implementation
        run: |
          if [ "${{ matrix.psr18 }}" = "symfony" ]; then
            composer remove --dev --no-update guzzlehttp/guzzle guzzlehttp/psr7
            composer require --dev --no-update symfony/http-client:^7.1 nyholm/psr7:^1.8.2
          fi

      - name: Install dependencies
        run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite unit

  # The pure-PHP protobuf runtime and ext-protobuf do not agree on every edge case --
  # each accepts malformed input the other rejects. Testing only the runtime that
  # comes with Composer means half the installed base is untested, so this job runs
  # the suite against the extension we suggest.
  tests-ext-protobuf:
    name: PHP ${{ matrix.php }} / ext-protobuf
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # composer.json conflicts with ext-protobuf < 5.34, whose GPBUtil has no
          # compatibleInt64() for protoc 36's generated int64 getters to call.
          extensions: json, mbstring, bcmath, protobuf
          coverage: none

      - name: Confirm the extension is the runtime in use
        run: |
          php -r 'exit(extension_loaded("protobuf") ? 0 : 1);'
          php -r 'printf("ext-protobuf %s\n", phpversion("protobuf"));'

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite unit

  mock-server:
    name: Against livekit/test-server / ${{ matrix.psr18 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        psr18: ['guzzle', 'symfony']
    services:
      # The programmable mock every official LiveKit server SDK tests against.
      # It binds one listener per simulated region; 9999 is the primary and the
      # rest are failover targets advertised by GET /settings/regions.
      test-server:
        image: livekit/test-server:latest
        ports:
          - 9999:9999
          - 10000:10000
          - 10001:10001
          - 10002:10002
        env:
          # Our AccessToken refuses to sign with anything shorter than 32 bytes,
          # so the mock cannot run on its own `livekit-server --dev` default of
          # "secret". Not a credential: the mock accepts whatever it is given.
          LK_TEST_SERVER_API_SECRET: test-server-secret-not-a-real-credential
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, bcmath
          coverage: none

      - name: Select PSR-18 implementation
        run: |
          if [ "${{ matrix.psr18 }}" = "symfony" ]; then
            composer remove --dev --no-update guzzlehttp/guzzle guzzlehttp/psr7
            composer require --dev --no-update symfony/http-client:^7.1 nyholm/psr7:^1.8.2
          fi

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Wait for the mock server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/settings/regions >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::the mock server never became ready"
          exit 1

      # --fail-on-skipped is the point of this step, not a detail. Every test in
      # this suite skips itself when the environment is missing, so without it a
      # job that lost its env vars would report success having asserted nothing
      # -- a green check for a suite that ran zero tests.
      - name: Run the mock-server suite
        run: vendor/bin/phpunit --testsuite mock-server --fail-on-skipped
        env:
          LIVEKIT_TEST_SERVER_URL: http://127.0.0.1:9999
          LIVEKIT_TEST_SERVER_SECRET: test-server-secret-not-a-real-credential

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # composer.lock is not committed -- a library resolves against its consumer's
      # tree, not ours -- so `install` would print that it is updating instead.
      - run: composer update --prefer-dist --no-interaction --no-progress
      # Through composer, so the memory limit is defined once. PHP's 128M default
      # is not enough for PHPStan's parallel workers on this tree, and the failure
      # is a crashed child process rather than an analysis error -- easy to mistake
      # for a real finding.
      - run: composer analyse -- --no-progress

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # composer.lock is not committed -- a library resolves against its consumer's
      # tree, not ours -- so `install` would print that it is updating instead.
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  composer-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict

  protocol-version:
    name: Pinned protocol version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version is written by hand in the README, NOTICE, CHANGELOG and
      # CONTRIBUTING, in the `go get` line of each fixture generator, and generated
      # into src/ProtocolVersion.php. Remembering to edit all of them does not
      # survive a real upgrade, so check it rather than trust it.
      - run: bin/check-protocol-version.sh

  forbidden-symbols:
    name: No Internal RepeatedField in any shipped code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Internal\RepeatedField survives only as a class_alias, created when
      # Google\Protobuf\RepeatedField loads, so no static analyser can see it and
      # PSR-4 cannot autoload it. Nothing fatals from a `use` statement or a
      # docblock, but a downstream project running PHPStan over code that touches
      # one of these getters is told the class is unknown and loses the type.
      #
      # src/Proto used to be excluded here, because protoc 29.3 emitted the old
      # name. The generator now requires protoc >= 36.2, which emits the canonical
      # one, so the rule covers all of src -- and this job is what catches a
      # regeneration done with an older protoc.
      - name: Reject the non-autoloadable RepeatedField alias
        run: |
          if grep -rn 'Internal\\RepeatedField' src metadata; then
            echo "::error::Use \\Google\\Protobuf\\RepeatedField - the Internal alias is not autoloadable"
            exit 1
          fi

  proto-drift:
    name: Generated protobuf is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install protoc
        run: |
          # Read it from the generator rather than repeating it here. protoc's output
          # differs between versions, and the drift step below compares the result
          # against committed files -- so a CI protoc that is merely *compatible*
          # with the script's minimum, rather than the same, fails with a diff that
          # looks like someone forgot to regenerate.
          PROTOC_VERSION="$(grep -oE 'MIN_PROTOC_VERSION="[^"]+"' bin/generate-protos.sh | cut -d'"' -f2)"
          if [ -z "$PROTOC_VERSION" ]; then
            echo "::error::could not read MIN_PROTOC_VERSION from bin/generate-protos.sh"
            exit 1
          fi
          echo "Installing protoc ${PROTOC_VERSION}"
          curl -sSLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
      # composer.lock is not committed -- a library resolves against its consumer's
      # tree, not ours -- so `install` would print that it is updating instead.
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: bin/generate-protos.sh
      - name: Fail if generated code drifted
        run: |
          # `git diff` alone misses added files: generate-protos.sh does
          # `rm -rf src/Proto` and regenerates, so a new upstream message type
          # shows up as an UNTRACKED file, which `git diff` never reports.
          # `git status --porcelain --untracked-files=all` sees added, modified
          # and deleted paths alike.
          drift="$(git status --porcelain --untracked-files=all -- src/Proto metadata src/ProtocolVersion.php)"
          if [ -n "$drift" ]; then
            echo "::error::Generated code (src/Proto, metadata, src/ProtocolVersion.php) is out of date. Run bin/generate-protos.sh and commit the diff."
            echo "$drift"
            exit 1
          fi
