name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} / ${{ matrix.psr18 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['prefer-lowest', 'prefer-stable']
        psr18: ['guzzle', 'symfony']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, bcmath
          coverage: none

      - name: Select PSR-18 implementation
        run: |
          if [ "${{ matrix.psr18 }}" = "symfony" ]; then
            composer remove --dev --no-update guzzlehttp/guzzle guzzlehttp/psr7
            composer require --dev --no-update symfony/http-client:^7.1 nyholm/psr7:^1.8
          fi

      - name: Install dependencies
        run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite unit

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  composer-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict

  protocol-version:
    name: Pinned protocol version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The version is written by hand in the README, NOTICE, CHANGELOG and
      # CONTRIBUTING, and generated into src/Proto. Remembering to edit all of
      # them does not survive a real upgrade, so check it rather than trust it.
      - run: bin/check-protocol-version.sh

  forbidden-symbols:
    name: No Internal RepeatedField in hand-written code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Internal\RepeatedField survives only as a class_alias in protobuf v5, and
      # PSR-4 cannot autoload an alias, so a reference fatals on a cold autoloader.
      # Prose in a plan does not prevent one; this does.
      - name: Reject the non-autoloadable RepeatedField alias
        run: |
          if grep -rn 'Internal\\RepeatedField' src --exclude-dir=Proto; then
            echo "::error::Use \\Google\\Protobuf\\RepeatedField - the Internal alias is not autoloadable"
            exit 1
          fi

  proto-drift:
    name: Generated protobuf is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install protoc
        run: |
          PROTOC_VERSION=29.3
          curl -sSLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: bin/generate-protos.sh
      - name: Fail if generated code drifted
        run: |
          # `git diff` alone misses added files: generate-protos.sh does
          # `rm -rf src/Proto` and regenerates, so a new upstream message type
          # shows up as an UNTRACKED file, which `git diff` never reports.
          # `git status --porcelain --untracked-files=all` sees added, modified
          # and deleted paths alike.
          drift="$(git status --porcelain --untracked-files=all -- src/Proto)"
          if [ -n "$drift" ]; then
            echo "::error::Generated src/Proto is out of date. Run bin/generate-protos.sh and commit the diff."
            echo "$drift"
            exit 1
          fi
