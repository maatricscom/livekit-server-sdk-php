name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the integration suite can be run against a deployment on demand, without
  # waiting for a push to main.
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes another on the same ref makes the earlier run's result
# irrelevant, and this workflow is twelve jobs wide. main is excluded: its runs are
# what the badge and the release history refer to, so they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} / ${{ matrix.psr18 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['prefer-lowest', 'prefer-stable']
        psr18: ['guzzle', 'symfony']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, bcmath
          coverage: none

      - name: Select PSR-18 implementation
        run: |
          if [ "${{ matrix.psr18 }}" = "symfony" ]; then
            composer remove --dev --no-update guzzlehttp/guzzle guzzlehttp/psr7
            composer require --dev --no-update symfony/http-client:^7.1 nyholm/psr7:^1.8.2
          fi

      - name: Install dependencies
        run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite unit

  # The pure-PHP protobuf runtime and ext-protobuf do not agree on every edge case --
  # each accepts malformed input the other rejects. Testing only the runtime that
  # comes with Composer means half the installed base is untested, so this job runs
  # the suite against the extension we suggest.
  tests-ext-protobuf:
    name: PHP ${{ matrix.php }} / ext-protobuf
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # composer.json conflicts with ext-protobuf < 5.34, whose GPBUtil has no
          # compatibleInt64() for protoc 36's generated int64 getters to call.
          extensions: json, mbstring, bcmath, protobuf
          coverage: none

      - name: Confirm the extension is the runtime in use
        run: |
          php -r 'exit(extension_loaded("protobuf") ? 0 : 1);'
          php -r 'printf("ext-protobuf %s\n", phpversion("protobuf"));'

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit --testsuite unit

  mock-server:
    name: Against livekit/test-server / ${{ matrix.psr18 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        psr18: ['guzzle', 'symfony']
    services:
      # The programmable mock every official LiveKit server SDK tests against.
      # It binds one listener per simulated region; 9999 is the primary and the
      # rest are failover targets advertised by GET /settings/regions.
      test-server:
        image: livekit/test-server:latest
        ports:
          - 9999:9999
          - 10000:10000
          - 10001:10001
          - 10002:10002
        env:
          # Our AccessToken refuses to sign with anything shorter than 32 bytes,
          # so the mock cannot run on its own `livekit-server --dev` default of
          # "secret". Not a credential: the mock accepts whatever it is given.
          LK_TEST_SERVER_API_SECRET: test-server-secret-not-a-real-credential
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, bcmath
          coverage: none

      - name: Select PSR-18 implementation
        run: |
          if [ "${{ matrix.psr18 }}" = "symfony" ]; then
            composer remove --dev --no-update guzzlehttp/guzzle guzzlehttp/psr7
            composer require --dev --no-update symfony/http-client:^7.1 nyholm/psr7:^1.8.2
          fi

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Wait for the mock server
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/settings/regions >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::the mock server never became ready"
          exit 1

      # --fail-on-skipped is the point of this step, not a detail, and it was
      # measured rather than assumed. Without it, a run with the environment
      # missing skips all 143 tests, asserts nothing, and exits 0 under the words
      # "OK, but some tests were skipped" -- a green check over an empty run. With
      # it the same run exits 1, and so does a half-configured one with only the
      # URL set. With the server up it exits 0 on 143 tests and 695 assertions.
      #
      # It is safe here only because a skip in this suite can mean one thing:
      # MockServerTestCase's check for LIVEKIT_TEST_SERVER_URL and
      # LIVEKIT_TEST_SERVER_SECRET is the suite's only one. The integration job
      # deliberately does not use the flag, because skipIfUnavailable() is called
      # two dozen times there and a deployment without SIP is a valid one to run
      # against; that job checks its environment in the shell instead.
      # ToolingConfigTest fails if a feature-conditional skip is ever added here,
      # which would turn this flag from a guard into a false alarm.
      - name: Run the mock-server suite
        run: vendor/bin/phpunit --testsuite mock-server --fail-on-skipped
        env:
          LIVEKIT_TEST_SERVER_URL: http://127.0.0.1:9999
          LIVEKIT_TEST_SERVER_SECRET: test-server-secret-not-a-real-credential

  integration:
    name: Against a real LiveKit deployment
    # Never on pull_request. A workflow triggered by a pull request runs the code
    # in that pull request, so giving this job the secrets would hand a live API
    # key and secret to anyone who opens one -- a fork only has to edit a test to
    # print them. GitHub withholds secrets from fork-triggered runs for exactly
    # this reason, which would make the job fail rather than be safe; refusing to
    # run it at all is the honest version. Pushes to main and manual dispatches
    # are the trusted paths, and both are covered.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One at a time. These tests create and delete objects in a real project, and
    # two runs racing each other there is a source of failures that says nothing
    # about the code. Queued rather than cancelled: a half-finished run is what
    # leaves objects behind.
    concurrency:
      group: integration-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, bcmath
          coverage: none

      # composer.lock is not committed -- a library resolves against its consumer's
      # tree, not ours -- so `install` would print that it is updating instead.
      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the integration suite
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          # The suite skips itself when these are unset, which is the right
          # behaviour for a contributor running it locally and the wrong result to
          # report here: a job that skipped every test because a secret went
          # missing would be a green tick over nothing. Checking first separates
          # "not configured" from "configured and broken".
          if [ -z "${LIVEKIT_URL}" ] || [ -z "${LIVEKIT_API_KEY}" ] || [ -z "${LIVEKIT_API_SECRET}" ]; then
            echo "::notice title=Integration suite not run::Set the LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET repository secrets to run these against a deployment."
            exit 0
          fi

          # Deliberately without --fail-on-skipped, unlike the mock-server job. A
          # deployment with no SIP or no egress provisioned is a valid one, and the
          # suite skips those features on purpose; the case that flag exists to
          # catch is the missing environment, which the check above already did.
          vendor/bin/phpunit --testsuite integration

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # composer.lock is not committed -- a library resolves against its consumer's
      # tree, not ours -- so `install` would print that it is updating instead.
      - run: composer update --prefer-dist --no-interaction --no-progress
      # Through composer, so the memory limit is defined once. PHP's 128M default
      # is not enough for PHPStan's parallel workers on this tree, and the failure
      # is a crashed child process rather than an analysis error -- easy to mistake
      # for a real finding.
      - run: composer analyse -- --no-progress

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # composer.lock is not committed -- a library resolves against its consumer's
      # tree, not ours -- so `install` would print that it is updating instead.
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test

  composer-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict

  shellcheck:
    name: Shell scripts pass ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned rather than taken from the runner image, which ships 0.9.0 today.
      # ShellCheck gains diagnostics between releases, so an unpinned one can turn
      # this job red without anything in the repository having moved -- and an
      # --enable name that a older build does not know is a hard error, not a
      # skipped check. Upgrading is then a deliberate commit.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -sSLo /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version

      # Default severity, plus the four optional checks that find bugs rather than
      # state a preference: an unassigned uppercase variable is usually a typo, a
      # function called where set -e is suppressed does not abort, a nullary [ $x ]
      # tests the wrong thing, and `which` is not reliably present.
      #
      # The rest of --list-optional is style: braces around every variable and
      # [[ ]] over [ ], which between them would rewrite most lines of both
      # scripts and catch nothing. Both scripts are clean at this setting today.
      - name: Lint bin/*.sh
        run: |
          shellcheck \
            --enable=check-unassigned-uppercase,check-set-e-suppressed,avoid-nullary-conditions,deprecate-which \
            bin/*.sh

  gofmt:
    name: Go fixture generators are formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Deliberately not pinned. gofmt has one canonical output and following it
      # is the whole point: if a Go release reformats something, the right answer
      # is to run gofmt -w and commit, not to hold the tree at an older idea of
      # formatted. That is the opposite of the ShellCheck job above, where an
      # upgrade brings new opinions rather than a new normal form.
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # gofmt -l exits 0 whether or not it listed a file, so its exit code reports
      # nothing and only its output does. A step written as `gofmt -l bin/` would
      # pass forever while printing the failures it was added to catch.
      #
      # Formatting is all this checks. Both generators carry //go:build ignore and
      # import livekit/protocol, so `go vet` would first have to resolve that
      # module and its dependency tree -- a large download to analyse two files
      # that CI never runs and that ship in no release.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l bin/)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean. Run: gofmt -w bin/"
            echo "$unformatted"
            gofmt -d bin/
            exit 1
          fi
          echo "bin/*.go is gofmt-clean"

  protocol-version:
    name: Pinned protocol version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version is written by hand in the README, NOTICE, CHANGELOG and
      # CONTRIBUTING, in the `go get` line of each fixture generator, and generated
      # into src/ProtocolVersion.php. Remembering to edit all of them does not
      # survive a real upgrade, so check it rather than trust it.
      - run: bin/check-protocol-version.sh

  forbidden-symbols:
    name: No Internal RepeatedField in any shipped code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Internal\RepeatedField survives only as a class_alias, created when
      # Google\Protobuf\RepeatedField loads, so no static analyser can see it and
      # PSR-4 cannot autoload it. Nothing fatals from a `use` statement or a
      # docblock, but a downstream project running PHPStan over code that touches
      # one of these getters is told the class is unknown and loses the type.
      #
      # src/Proto used to be excluded here, because protoc 29.3 emitted the old
      # name. The generator now requires protoc >= 36.2, which emits the canonical
      # one, so the rule covers all of src -- and this job is what catches a
      # regeneration done with an older protoc.
      - name: Reject the non-autoloadable RepeatedField alias
        run: |
          if grep -rn 'Internal\\RepeatedField' src metadata; then
            echo "::error::Use \\Google\\Protobuf\\RepeatedField - the Internal alias is not autoloadable"
            exit 1
          fi

  proto-drift:
    name: Generated protobuf is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install protoc
        run: |
          # Read it from the generator rather than repeating it here. protoc's output
          # differs between versions, and the drift step below compares the result
          # against committed files -- so a CI protoc that is merely *compatible*
          # with the script's minimum, rather than the same, fails with a diff that
          # looks like someone forgot to regenerate.
          PROTOC_VERSION="$(grep -oE 'MIN_PROTOC_VERSION="[^"]+"' bin/generate-protos.sh | cut -d'"' -f2)"
          if [ -z "$PROTOC_VERSION" ]; then
            echo "::error::could not read MIN_PROTOC_VERSION from bin/generate-protos.sh"
            exit 1
          fi
          echo "Installing protoc ${PROTOC_VERSION}"
          curl -sSLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
      # composer.lock is not committed -- a library resolves against its consumer's
      # tree, not ours -- so `install` would print that it is updating instead.
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: bin/generate-protos.sh
      - name: Fail if generated code drifted
        run: |
          # `git diff` alone misses added files: generate-protos.sh does
          # `rm -rf src/Proto` and regenerates, so a new upstream message type
          # shows up as an UNTRACKED file, which `git diff` never reports.
          # `git status --porcelain --untracked-files=all` sees added, modified
          # and deleted paths alike.
          drift="$(git status --porcelain --untracked-files=all -- src/Proto metadata src/ProtocolVersion.php)"
          if [ -n "$drift" ]; then
            echo "::error::Generated code (src/Proto, metadata, src/ProtocolVersion.php) is out of date. Run bin/generate-protos.sh and commit the diff."
            echo "$drift"
            exit 1
          fi
